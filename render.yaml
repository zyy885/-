services:
  - type: web
    name: vocab-app
    runtime: node
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "node src/server.js"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true
